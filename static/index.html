<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flight & Stay Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>✈️ Flight & Stay Agent</h1>
    <form id="planForm">
      <label>Origin (IATA code)</label>
      <input type="text" id="origin" placeholder="ABV" required />

      <label>Destination (IATA code)</label>
      <input type="text" id="destination" placeholder="LOS" required />

      <label>Earliest date</label>
      <input type="date" id="earliest_date" required />

      <label>Latest date</label>
      <input type="date" id="latest_date" required />

      <label>Travelers</label>
      <input type="number" id="travelers" value="1" min="1" required />

      <label>Preferences</label>
      <textarea id="preferences" rows="3" placeholder="cheapest option, morning flights, 4-star hotel"></textarea>

      <button type="submit">Find Best Trip</button>
    </form>

    <div id="loading" style="display:none;">Thinking...</div>
    <div id="result"></div>
  </div>
  <script src="/static/script.js"></script>
</body>
</html>
